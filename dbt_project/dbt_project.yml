name: 'dataflow'
version: '1.0.0'
config-version: 2

profile: 'dataflow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dataflow:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table   # ADD THIS — fact/dim tables should be real tables, not views